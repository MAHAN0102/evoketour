<!DOCTYPE html>
<html lang="gu">
<head>
    <script>
    localStorage.removeItem('evokeUser');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evoke Tour - Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #f4e8c1 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .reg-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.25);
            border: 1px solid #e6d5b8;
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #2c2518; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #4a3b22; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fffcf5;
        }
        .btn-submit {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(255, 126, 95, 0.3);
        }
        .ref-info {
            background: #fcf4e1;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: #2c2518;
            margin-bottom: 15px;
            border: 1px dashed #d4af37;
        }
    </style>
</head>
<body>

<div class="reg-container">
    <h2>🌟 Evoke Tour Registration</h2>
    
    <div id="sponsorInfoBox" class="ref-info">
        સ્પોન્સર તપાસી રહ્યા છીએ...
    </div>

    <div class="form-group">
        <label>પૂરું નામ (Full Name):</label>
        <input type="text" id="regName" placeholder="તમારું નામ દાખલ કરો">
    </div>

    <div class="form-group">
        <label>મોબાઈલ નંબર (Mobile Number):</label>
        <input type="text" id="regMobile" maxlength="10" placeholder="10 આંકડાનો નંબર">
    </div>

    <div class="form-group">
        <label>પાસવર્ડ (Password):</label>
        <input type="password" id="regPass" placeholder="પાસવર્ડ બનાવો">
    </div>

    <button class="btn-submit" onclick="registerUser()">રજીસ્ટ્રેશન કરો (Register)</button>
</div>

<script>
    // નવો યુઝર આવે એટલે જૂનું લોગિન સેશન સાફ કરો જેથી ડેશબોર્ડ ન ખુલે
    localStorage.removeItem('evokeUser');

    const supabaseUrl = 'https://imggtidezvfxxpovftyx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltZ2d0aWRlenZmeHhwb3ZmdHl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMzk2MDQsImV4cCI6MjEwMjYxNTYwNH0.R386PRqplXZeJsAZk_kLgCi-MDGzOeaoVdHAB7TGiJ8';
    const myDb = supabase.createClient(supabaseUrl, supabaseKey);

    // URL માંથી ?ref=ET... મેળવો
    const urlParams = new URLSearchParams(window.location.search);
    const sponsorRef = urlParams.get('ref') || "ET2"; 

    document.getElementById('sponsorInfoBox').innerText = "સ્પોન્સર ID: " + sponsorRef;

    async function registerUser() {
        const name = document.getElementById('regName').value.trim();
        const mobile = document.getElementById('regMobile').value.trim();
        const password = document.getElementById('regPass').value.trim();

        if (!name || !mobile || !password) {
            alert("કૃપા કરીને બધી જ વિગતો ભરો!");
            return;
        }

        if (mobile.length !== 10) {
            alert("મોબાઈલ નંબર 10 આંકડાનો હોવો જરૂરી છે.");
            return;
        }

        const { data: existingUser } = await myDb
            .from('users')
            .select('*')
            .eq('mobile_number', mobile)
            .single();

        if (existingUser) {
            alert("❌ આ મોબાઈલ નંબરથી પહેલેથી જ રજીસ્ટ્રેશન થયેલું છે!");
            return;
        }

        const { data, error } = await myDb
            .from('users')
            .insert([
                {
                    name: name,
                    mobile_number: mobile,
                    password: password,
                    sponsor_id: sponsorRef,
                    status: 'Unactive',
                    total_limit: 0
                }
            ])
            .select()
            .single();

        if (error) {
            alert("❌ રજીસ્ટ્રેશનમાં ભૂલ: " + error.message);
        } else {
            alert("✅ અભિનંદન! તમારું રજીસ્ટ્રેશન સફળ થઈ ગયું છે.");
            localStorage.setItem('evokeUser', JSON.stringify(data));
            window.location.href = "dashboard.html";
        }
    }
</script>

</body>
</html>

<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #f4e8c1 100%);

            background: #fcf4e1;
            padding: 10px;
            border-radius: 8px;

            margin-bottom: 15px;
            border: 1px dashed #d4af37;
        }
    </style>
</head>
<body>

<div class="reg-container">
    <h2>🌟 Evoke Tour Registration</h2>
    
    <div id="sponsorInfoBox" class="ref-info">
        સ્પોન્સર તપાસી રહ્યા છીએ...

    <div class="form-group">
        <label>પૂરું નામ (Full Name):</label>
        <input type="text" id="regName" placeholder="તમારું નામ દાખલ કરો">

    <div class="form-group">

    <div class="form-group">
        <label>પાસવર્ડ (Password):</label>
        <input type="password" id="regPass" placeholder="પાસવર્ડ બનાવો">
    </div>

    <button class="btn-submit" onclick="registerUser()">રજીસ્ટ્રેશન કરો (Register)</button>
</div>
<script>

    <script>
    const supabaseUrl = 'https://imggtidezvfxxpovftyx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltZ2d0aWRlenZmeHhwb3ZmdHl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMzk2MDQsImV4cCI6MjEwMjYxNTYwNH0.R386PRqplXZeJsAZk_kLgCi-MDGzOeaoVdHAB7TGiJ8';
    const myDb = supabase.createClient(supabaseUrl, supabaseKey);

    // URL માંથી ?ref=ET... મેળવો
    const urlParams = new URLSearchParams(window.location.search);
    const sponsorRef = urlParams.get('ref') || "ET2"; // જો કોઈ લિંક ન હોય તો ડિફોલ્ટ એડમિન સ્પોન્સર

    document.getElementById('sponsorInfoBox').innerText = "સ્પોન્સર ID: " + sponsorRef;

    async function registerUser() {
        const name = document.getElementById('regName').value.trim();
        const mobile = document.getElementById('regMobile').value.trim();
        const password = document.getElementById('regPass').value.trim();

        if (!name || !mobile || !password) {
            alert("કૃપા કરીને બધી જ વિગતો ભરો!");
            return;
        }

        if (mobile.length !== 10) {
            alert("મોબાઈલ નંબર 10 આંકડાનો હોવો જરૂરી છે.");
            return;
        }

        // ચેક કરો કે મોબાઈલ નંબર પહેલેથી રજીસ્ટર્ડ તો નથી ને
        const { data: existingUser } = await myDb
            .from('users')
            .select('*')
            .eq('mobile_number', mobile)
            .single();

        if (existingUser) {
            alert("❌ આ મોબાઈલ નંબરથી પહેલેથી જ રજીસ્ટ્રેશન થયેલું છે!");
            return;
        }

        // નવું રજીસ્ટ્રેશન સેવ કરો (સંબંધિત sponsor_id સાથે)
        const { data, error } = await myDb
            .from('users')
            .insert([
                {
                    name: name,
                    mobile_number: mobile,
                    password: password,
                    sponsor_id: sponsorRef, // જેની લિંક હશે તેનો ID અહીં સેવ થશે જેથી ટીમ બનશે
                    status: 'Unactive',
                    total_limit: 30000
                }
            ])
            .select()
            .single();

        if (error) {
            alert("❌ રજીસ્ટ્રેશનમાં ભૂલ: " + error.message);
        } else {
            alert("✅ અભિનંદન! તમારું રજીસ્ટ્રેશન સફળ થઈ ગયું છે.");
            localStorage.setItem('evokeUser', JSON.stringify(data));
            window.location.href = "dashboard.html";
        }
    }
    <script>
    // ૧. ૧૦૦% સાચી રજીસ્ટ્રેશન લિંક મેળવવાનું ફંક્શન
    function getRegistrationLink() {
        let user = JSON.parse(localStorage.getItem('evokeUser'));
        let userId = (user && user.id) ? user.id : "2"; // જો આઈડી ન મળે તો ડિફોલ્ટ 2
        let formattedId = "ET" + userId;
        
        // તમારી સાચી નેટલિફાઈ લિંક
        return "https://evoke-login.netlify.app/register.html?ref=" + formattedId;
    }

    // ૨. લિંક કોપી કરવા માટેનું પરફેક્ટ ફંક્શન
    window.copyRefLink = function() {
        let link = getRegistrationLink();
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(() => {
                alert("✅ રજીસ્ટ્રેશન લિંક કોપી થઈ ગઈ છે:\n" + link);
            }).catch(() => {
                fallbackCopy(link);
            });
        } else {
            fallbackCopy(link);
        }
    }

    function fallbackCopy(text) {
        let tempInput = document.createElement("input");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
            document.execCommand('copy');
            alert("✅ રજીસ્ટ્રેશન લિંક કોપી થઈ ગઈ છે:\n" + text);
        } catch (err) {
            alert("❌ લિંક કોપી કરવામાં નિષ્ફળ!");
        }
        document.body.removeChild(tempInput);
    }

    // ૩. WhatsApp પર શેર કરવા માટેનું ફંક્શન
    window.shareOnWhatsApp = function() {
        let link = getRegistrationLink();
        let message = "🌟 Evoke Tour માં જોડાઓ અને શાનદાર અર્નિંગ કરો! રજીસ્ટ્રેશન કરવા માટે અહીં ક્લિક કરો: " + link;
        
        let whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(message);
        window.open(whatsappUrl, '_blank');
    }
</script>
</script>

</body>
</html>

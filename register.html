<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evoke Tour - Registration</title>
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial, sans-serif; background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px; box-sizing: border-box;">
  
  <div style="background: white; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center;">
    
    <h1 style="color: #00838f; margin-bottom: 5px; font-size: 28px; font-weight: 900; letter-spacing: 1px;">Evoke Tour 4.0</h1>
    <p style="color: #555; margin-bottom: 25px; font-size: 16px; font-weight: bold;">પ્રોફેશનલ રજીસ્ટ્રેશન ફોર્મ 📝</p>

    <!-- રજિસ્ટ્રેશન ફોર્મ -->
    <form id="registerForm" onsubmit="registerPartner(event)">
      
      <div style="text-align: left; margin-bottom: 15px;">
        <label style="display: block; color: #333; font-weight: bold; margin-bottom: 5px;">સ્પોન્સર ID (Sponsor ID) *</label>
        <input type="text" id="sponsor_id" required placeholder="દા.ત. EVK1001" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none;">
      </div>

      <div style="text-align: left; margin-bottom: 15px;">
        <label style="display: block; color: #333; font-weight: bold; margin-bottom: 5px;">પૂરું નામ (Full Name) *</label>
        <input type="text" id="full_name" required placeholder="તમારું પૂરું નામ લખો" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none;">
      </div>

      <div style="text-align: left; margin-bottom: 15px;">
        <label style="display: block; color: #333; font-weight: bold; margin-bottom: 5px;">મોબાઈલ નંબર (Mobile Number) *</label>
        <input type="tel" id="mobile" required placeholder="10 આંકડાનો નંબર" pattern="[0-9]{10}" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none;">
      </div>

      <div style="text-align: left; margin-bottom: 25px;">
        <label style="display: block; color: #333; font-weight: bold; margin-bottom: 5px;">નવો પાસવર્ડ બનાવો (Password) *</label>
        <input type="password" id="password" required placeholder="પાસવર્ડ દાખલ કરો" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none;">
      </div>

      <button type="submit" style="width: 100%; background-color: #00838f; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0, 131, 143, 0.3); transition: 0.3s;">
        રજીસ્ટર કરો (Register)
      </button>
    </form>

    <div style="margin-top: 20px;">
      <p style="font-size: 14px; color: #666;">પહેલેથી એકાઉન્ટ છે? <a href="index.html" style="color: #ff9800; text-decoration: none; font-weight: bold;">અહીં લોગિન કરો</a></p>
    </div>

  </div>

  <!-- જાવાસ્ક્રિપ્ટ અને ડેટાબેઝ કનેક્શન -->
  <script>
    const supabaseUrl = 'https://imggtidezvfxxpovftyx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltZ2d0aWRlenZmeHhwb3ZmdHl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMzk2MDQsImV4cCI6MjEwMjYxNTYwNH0.R386PRqplXZeJsAZk_kLgCi-MDGzOeaoVdHAB7TGiJ8';
    
    const myDb = supabase.createClient(supabaseUrl, supabaseKey);

    async function registerPartner(event) {
      event.preventDefault();
      
      const submitBtn = document.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = 'પ્રોસેસ થઈ રહ્યું છે... ⏳';

      const sponsorId = document.getElementById('sponsor_id').value;
      const fullName = document.getElementById('full_name').value;
      const mobile = document.getElementById('mobile').value;
      const password = document.getElementById('password').value;

      try {
        // ૧. ચેક કરો કે આ નંબર પહેલેથી રજીસ્ટર તો નથી ને?
        const { data: existingUser, error: checkError } = await myDb
          .from('users')
          .select('mobile_number')
          .eq('mobile_number', mobile);
        
        if (checkError) throw checkError;

        if (existingUser && existingUser.length > 0) {
          alert("❌ આ મોબાઈલ નંબર પહેલેથી જ રજીસ્ટર થયેલો છે. કૃપા કરીને લોગિન કરો.");
          submitBtn.innerText = originalText;
          return;
        }

        // ૨. નવા યુઝરનો ડેટા સેવ કરો
        const { data, error } = await myDb
          .from('users')
          .insert([
            { sponsor_id: sponsorId, name: fullName, mobile_number: mobile, password: password }
          ]);

        if (error) {
          alert("❌ રજીસ્ટ્રેશનમાં ભૂલ: " + error.message);
        } else {
          alert("✅ સફળતાપૂર્વક રજીસ્ટ્રેશન થઈ ગયું છે! હવે તમે લોગિન કરી શકો છો.");
          // રજીસ્ટ્રેશન પછી સીધા લોગિન પેજ પર મોકલવા માટે
          window.location.href = "index.html"; 
        }
      } catch (err) {
        alert("❌ સર્વર એરર: " + err.message);
      }
      
      submitBtn.innerText = originalText;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evoke Tour - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #f4e8c1 100%);
            margin: 0;
            padding: 15px;
            color: #333;
        }

        .dashboard-container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.25);
            overflow: hidden;
            border: 1px solid #e6d5b8;
        }

        .header {
            background: linear-gradient(135deg, #2c2518, #4a3b22);
            color: #f4e8c1;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #d4af37;
        }

        .header h1 { margin: 0; font-size: 22px; letter-spacing: 1px; color: #f4e8c1; }

        .content { padding: 15px; }

        /* Profile Card */
        .profile-card {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.3);
        }
        .profile-card h2 { margin: 0 0 5px; font-size: 24px; font-weight: 700; }
        .profile-card p { margin: 0; font-size: 15px; font-weight: 600; opacity: 0.95; }
        .profile-card .sub-info { font-size: 13px; margin-top: 8px; opacity: 0.9; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: linear-gradient(135deg, #fffcf5, #fcf4e1);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-box h3 { margin: 0; font-size: 13px; color: #666; }
        .stat-box p { margin: 6px 0 0; font-size: 18px; font-weight: 700; color: #2c2518; }

        /* Balance Sheet Card */
        .balance-card {
            background: #4a3b22;
            color: #f4e8c1;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #d4af37;
        }
        .balance-card h3 { margin: 0 0 15px; font-size: 15px; text-align: center; color: #d4af37; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 8px; }
        
        .b-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .b-row span { font-weight: 600; color: #fff; }

        /* Action Buttons */
        .action-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-bottom: 10px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-cyan { background: #00bcd4; color: white; }
        .btn-green { background: #25d366; color: white; }
        .btn-orange { background: #ff9800; color: white; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1>Evoke Tour Dashboard</h1>
    </div>

    <div class="content">
        <!-- Profile & Status Card -->
        <div class="profile-card" id="profileCardBg">
            <h2 id="dashName">યુઝર</h2>
            <p id="dashStatusText">(Unactive)</p>
            <div class="sub-info">ID: <span id="dashId">ET1001</span> | Mobile: <span id="dashMobile">----------</span></div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <h3>👥 ટોટલ ટીમ મેમ્બર</h3>
                <p id="totalTeam">0</p>
            </div>
            <div class="stat-box">
                <h3>🏆 લેવલ ઇનકમ</h3>
                <p id="levelIncome">₹ 0</p>
            </div>
        </div>

        <!-- Travel Bonus Balance Sheet -->
        <div class="balance-card">
            <h3>🎁 Travel Bonus Balance Sheet</h3>
            <div class="b-row"><span>Total Limit:</span> <span id="totalLimit">0</span></div>
            <div class="b-row"><span>Earning:</span> <span id="earningAmount">₹ 0</span></div>
            <div class="b-row"><span>Remaining Limit:</span> <span id="remainingLimit">0</span></div>
        </div>

        <!-- Action Buttons -->
        <button class="action-btn btn-cyan" onclick="openBankModal()">🏦 Bank & KYC Details (બેંક વિગતો)</button>
        <button class="action-btn btn-orange" onclick="copyRefLink()">📋 Copy Referral Link (લિંક કોપી કરો)</button>
        <button class="action-btn btn-green" onclick="shareOnWhatsApp()">💬 Share WhatsApp Link (વોટ્સએપ શેર)</button>
    </div>
</div>

<!-- Bank & KYC Modal -->
<div class="modal" id="bankModal">
    <div class="modal-content">
        <h3 style="color: #2c2518; margin-top: 0;">🏦 Bank & KYC Details</h3>
        <label style="font-size: 13px; font-weight: bold;">Account Holder Name:</label>
        <input type="text" id="accName" placeholder="બેંક ખાતા મુજબ નામ">
        
        <label style="font-size: 13px; font-weight: bold;">Account Number:</label>
        <input type="text" id="accNo" placeholder="ખાતા નંબર દાખલ કરો">
        
        <label style="font-size: 13px; font-weight: bold;">IFSC Code:</label>
        <input type="text" id="ifscCode" placeholder="IFSC કોડ દાખલ કરો">

        <button class="action-btn btn-cyan" onclick="saveBankDetails()">સેવ કરો (Save)</button>
        <button class="action-btn" style="background: #ccc; color: #333;" onclick="closeBankModal()">બંધ કરો (Close)</button>
    </div>
</div>

<script>
    // લોકલ સ્ટોરેજમાંથી યુઝર ડેટા મેળવો
    let user = JSON.parse(localStorage.getItem('evokeUser')) || {
        name: "હારેશભાઈ પટેલ",
        id: "ET" + Math.floor(1000 + Math.random() * 9000),
        mobile_number: "7010010079",
        is_active: false,
        earning: 0,
        team_count: 0
    };

    // જો આઈડી ન હોય તો નવો રેન્ડમ જનરેટ કરો
    if (!user.id || !user.id.startsWith("ET")) {
        user.id = "ET" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('evokeUser', JSON.stringify(user));
    }

    // ડેશબોર્ડ પર તરત જ વિગતો સેટ કરો
    document.getElementById('dashName').innerText = user.name;
    document.getElementById('dashId').innerText = user.id;
    document.getElementById('dashMobile').innerText = user.mobile_number;
    document.getElementById('totalTeam').innerText = user.team_count || 0;
    document.getElementById('levelIncome').innerText = "₹ " + (user.earning || 0);

    // Active / Unactive સ્ટેટસ અને બેલેન્સ શીટ મેનેજમેન્ટ
    if (user.is_active === true) {
        document.getElementById('dashStatusText').innerText = "(Active)";
        document.getElementById('profileCardBg').style.background = "linear-gradient(135deg, #11998e, #38ef7d)";
        document.getElementById('totalLimit').innerText = "₹ 30,000";
        document.getElementById('earningAmount').innerText = "₹ " + (user.earning || 0);
        document.getElementById('remainingLimit').innerText = "₹ " + (30000 - (user.earning || 0));
    } else {
        document.getElementById('dashStatusText').innerText = "(Unactive)";
        document.getElementById('totalLimit').innerText = "0";
        document.getElementById('earningAmount').innerText = "₹ 0";
        document.getElementById('remainingLimit').innerText = "0";
    }

    // રેફરલ લિંક જનરેટ કરવી
    const refLinkStr = window.location.origin + "/register.html?ref=" + user.id;

    function copyRefLink() {
        navigator.clipboard.writeText(refLinkStr);
        alert("✅ રેફરલ લિંક કોપી થઈ ગઈ છે!");
    }

    // વોટ્સએપ શેર કરવા માટેનું ફંક્શન (હવે પરફેક્ટ કામ કરશે)
    function shareOnWhatsApp() {
        const message = "🌟 Evoke Tour માં જોડાઓ અને શાનદાર અર્નિંગ કરો! મારી લિંકથી જોડાવવા માટે ક્લિક કરો: " + refLinkStr;
        const whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(message);
        window.open(whatsappUrl, '_blank');
    }

    // બેંક મોડલ
    function openBankModal() { document.getElementById('bankModal').style.display = 'flex'; }
    function closeBankModal() { document.getElementById('bankModal').style.display = 'none'; }
    function saveBankDetails() {
        alert("✅ બેંક અને KYC વિગતો સફળતાપૂર્વક સેવ થઈ ગઈ છે!");
        closeBankModal();
    }
</script>

</body>
    </html>
